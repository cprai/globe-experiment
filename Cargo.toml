[package]
name = "iced-test-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
glam = "0.33.1"
half = { version = "2.7.1", features = ["bytemuck"] }
iced = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }

# Texture decoding is too slow unoptimized: every earth map is 33 MP.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3
