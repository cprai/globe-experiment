[package]
name = "globe-experiment"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
glam = "0.33.1"
# RFC3339 datetime parsing for the `render` single-frame CLI mode.
humantime = "2"
# Decodes the embedded body and star textures at startup (jpeg/tiff) and encodes
# the `render` single-frame output (png). The textures are embedded verbatim by
# build.rs (no build-time transcode) and decoded here into uncompressed RGBA8,
# so only these three codecs are needed; other default formats are dropped.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
ktx2 = "0.5"
pollster = "0.4"
rayon = "1.10"
# SGP4 satellite propagation, the JPL DE440 ephemeris reader, and the
# IERS-2010 frame transforms behind the celestial sphere. default-features off
# drops the `download` feature (satkit's own runtime data fetch via ureq): the
# ephemeris, EOP table, and IERS tables are instead downloaded by build.rs,
# embedded, and seeded via the `init_from_bytes` APIs (see
# `simulation::celestial_sphere::init_satkit`).
satkit = { version = "0.18", default-features = false }
# Deserializes the `render --scene` JSON (simulation + camera + mock-panel ui)
# into the egui-free spec types (pure-Rust, portable across all six targets).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "29"
winit = "0.30"

# Texture decoding is too slow unoptimized: every terra map is 33 MP.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[build-dependencies]
bytemuck = "1.25.0"
half = { version = "2.7.1", features = ["bytemuck"] }
# Only the atmosphere LUTs are KTX2-wrapped at build time now; the Terra/star
# textures are downloaded and embedded verbatim (decoded at runtime), so there
# is no build-time image decode or BC7 transcode (no `image` / `intel_tex_2`).
ktx2 = "0.5"
ureq = "3.3.0"
