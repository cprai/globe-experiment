# The windowed app: src/main.rs + src/scenes/ over the `engine` library
# crate. The single-frame `headless` binary lives in `engine`
# (`cargo run -p engine --bin headless`).
[package]
name = "globe-experiment"
edition = "2024"

# The root package plus the engine library, the astrodynamics library and
# its verification harness, and the proc-macro helper; keeps fmt/clippy/test
# covering all five. The harness is a leaf no other crate depends on, so its
# reference astrodynamics deps never reach shipped builds.
[workspace]
members = [
    "crates/engine",
    "crates/engine-astrodynamics",
    "crates/engine-astrodynamics/tests",
    "crates/engine-macros",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
engine = { path = "crates/engine" }
glam = "0.33.1"
# Scene setup (TLE epochs, `Instant` scene times). default-features off as in
# `engine` - the ephemeris/EOP data is embedded there, satkit must not fetch.
satkit = { version = "0.18", default-features = false }

# Texture decoding is too slow unoptimized: every terra map is 33 MP. Profile
# overrides only apply from the workspace root, so these live here even though
# the decode happens in `engine`.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3
