[package]
name = "globe-experiment"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = "0.34.3"
glam = "0.33.1"
ktx2 = "0.5"
pollster = "0.4"
rayon = "1.10"
wgpu = "29"
winit = "0.30"

# Texture decoding is too slow unoptimized: every earth map is 33 MP.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[build-dependencies]
bytemuck = "1.25.0"
half = { version = "2.7.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff"] }
intel_tex_2 = "0.5"
ktx2 = "0.5"
ureq = "3.3.0"
