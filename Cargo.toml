[package]
name = "iced-test-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
glam = "0.33.1"
iced = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

# Texture decoding is too slow unoptimized: the day albedo alone is 33 MP.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3
