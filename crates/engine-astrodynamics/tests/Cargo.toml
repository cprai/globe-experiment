# Verification harness: compares engine-astrodynamics against reference
# implementations (raw satkit + the astrodyn JEOD port).
# Leaf crate — nothing depends on it, so its reference deps are never
# compiled into shipped builds; they live only here.
[package]
name = "engine-astrodynamics-tests"
edition = "2024"
# NOT the default `build.rs` at the package root: the PARENT crate
# auto-discovers `tests/*.rs` as its own integration-test targets, and this
# harness lives inside the parent's `tests/` directory. `src/` is outside
# every discovery glob.
build = "src/build.rs"

# `cargo bench` would otherwise also spin the libtest harness up for the
# lib target, which rejects criterion's CLI flags.
[lib]
bench = false

[dependencies]
engine-astrodynamics = { path = ".." }
glam = "0.33.1"
# The reference implementation (the crate's former backend). default-features
# off drops satkit's runtime data fetch; the harness's own build script
# downloads and `data::seed_satkit` embeds.
satkit = { version = "0.18", default-features = false }
# Second reference: the astrodyn family (pure-Rust port of NASA JEOD).
# Unlike satkit it shares anise with the crate under test, so its ephemeris
# comparison checks wiring (body mapping, units, frame chains), not the
# Chebyshev math; the frames/geodetic/kepler/propagation sides are
# independent JEOD ports and genuine cross-implementations.
astrodyn = "0.2"
astrodyn_runner = "0.2"
astrodyn_ephemeris = "0.2"
astrodyn_frames = "0.2"
astrodyn_time = "0.2"
astrodyn_math = "0.2"
astrodyn_quantities = "0.2"
# astrodyn's public surface speaks glam 0.30 (the workspace is on 0.33);
# the renamed dep exists solely to construct its input vectors.
glam030 = { package = "glam", version = "0.30" }

[dev-dependencies]
criterion = "0.8"

# Criterion comparison benches (crate vs reference satkit on the same
# problems), one target per domain so each runs alone in seconds:
# `cargo bench -p engine-astrodynamics-tests --bench <name>` (omit --bench
# to run all). Under `src/` like every other source file — see the note on
# `build` above; a conventional `benches/` dir would sit inside the
# parent's `tests/` directory next to its discovery globs, and `src/` is
# provably outside all of them.
[[bench]]
name = "ephemeris"
path = "src/benches/ephemeris.rs"
harness = false

[[bench]]
name = "frames"
path = "src/benches/frames.rs"
harness = false

[[bench]]
name = "geodetic"
path = "src/benches/geodetic.rs"
harness = false

[[bench]]
name = "kepler"
path = "src/benches/kepler.rs"
harness = false

[[bench]]
name = "sgp4"
path = "src/benches/sgp4.rs"
harness = false

[[bench]]
name = "propagation"
path = "src/benches/propagation.rs"
harness = false

[build-dependencies]
ureq = "3.3.0"
